name: scorecard

on:
  branch_protection_rule:
  schedule:
    # Saturdays 05:23 UTC
    - cron: '23 5 * * 6'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Scorecard's GraphQL checks need repo access the GITHUB_TOKEN does not
    # have on a private repository (githubv4.Query: Resource not accessible
    # by integration); the guard skips the job on private copies.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # publish_results sends the results to the public Scorecard API, which
      # the README badge reads. Publishing verifies this workflow: no top-level
      # write permissions, env or defaults; no job env, containers or services;
      # an Ubuntu runner; only checkout, scorecard-action, upload-artifact,
      # upload-sarif and harden-runner steps; id-token: write on this job only.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
