name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  corpus:
    uses: ./.github/workflows/corpus.yml
    permissions:
      contents: read

  release:
    needs: corpus
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      # Pushes and pull requests made with the built-in GITHUB_TOKEN start no workflows, so
      # the version PR would never get CI and could only be merged with --admin. A token from
      # the release GitHub App (installed on this repository only, contents and pull requests)
      # is used for the checkout's pushes and for changesets/action instead.
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # Node 24 ships npm 11.x; `npm stage` needs npm 11.15.0 or later. No
      # registry-url: authentication is npm trusted publishing (OIDC), no token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Versioning only. Changesets cannot publish through npm staged publishing,
      # so the steps below stage the release instead of `changeset publish`.
      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          push-with-git-cli: true
          # v2 takes the token as an input and refuses a GITHUB_TOKEN env that differs from it.
          github-token: ${{ steps.app-token.outputs.token }}

      # changesets/action v2 names this output `has-changesets` (v1 used `hasChangesets`);
      # reading the old name yields an empty string, so the release steps never ran.
      - name: Work out the release state
        id: state
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          MAJOR="v${VERSION%%.*}"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then LIVE=true; else LIVE=false; fi
          git fetch --tags --force origin
          TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}" || true)
          MAJOR_SHA=$(git rev-parse --verify --quiet "refs/tags/$MAJOR^{commit}" || true)
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
            echo "live=$LIVE"
            echo "tagged=$([ -n "$TAG_SHA" ] && echo true || echo false)"
            echo "major-current=$([ -n "$TAG_SHA" ] && [ "$TAG_SHA" = "$MAJOR_SHA" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      # Uploads the release to npm's staging queue. It goes live only when a
      # maintainer approves it on npmjs.com (or `npm stage approve`) with 2FA.
      - name: Stage the release on npm
        if: steps.state.outputs.live == 'false' && steps.state.outputs.tagged == 'false'
        run: |
          set -euo pipefail
          npm --version
          npm stage publish --provenance --access public

      - name: Tag the staged release
        if: steps.state.outputs.live == 'false' && steps.state.outputs.tagged == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.state.outputs.version }}"
          git push origin "v${{ steps.state.outputs.version }}"

      # Runs on the first push (or manual run) after the staged version was
      # approved, so `@v0` never points at a version that is not on npm.
      - name: Move the floating major-version tag for the Action
        if: steps.state.outputs.live == 'true' && steps.state.outputs.tagged == 'true' && steps.state.outputs.major-current == 'false'
        run: |
          set -euo pipefail
          MAJOR="${{ steps.state.outputs.major }}"
          git tag -f "$MAJOR" "v${{ steps.state.outputs.version }}^{commit}"
          git push origin "refs/tags/$MAJOR" --force
