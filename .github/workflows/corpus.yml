name: corpus

# Pinned corpus regression: lints public projects at fixed commits and compares the finding counts
# per rule with test/corpus/pins.json. Runs weekly, when the pins change, on demand, and from
# release.yml before every release step. Never on ordinary pull requests. The "Version Packages"
# pull request is opened with GITHUB_TOKEN, which does not trigger pull_request workflows, so the
# release gate is the call from release.yml rather than a pull_request trigger.

on:
  schedule:
    # Wednesdays 04:23 UTC
    - cron: '23 4 * * 3'
  push:
    branches: [main]
    paths:
      - test/corpus/**
      - scripts/corpus-regression.js
      - .github/workflows/corpus.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run corpus
